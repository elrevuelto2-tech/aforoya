<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AforoYa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-surface: #1c1c1e;
      --bg-input: #222228;
      --verde: #00ff88;
      --verde-dim: rgba(0,255,136,0.15);
      --rojo: #ff3355;
      --rojo-dim: rgba(255,51,85,0.15);
      --amarillo: #ffcc00;
      --amarillo-dim: rgba(255,204,0,0.15);
      --azul: #4488ff;
      --azul-dim: rgba(68,136,255,0.15);
      --texto: #f0f0f0;
      --texto-dim: #888;
      --border: rgba(255,255,255,0.08);
      --radius: 16px;
      --radius-sm: 10px;
      --shadow-verde: 0 0 32px rgba(0,255,136,0.2);
      --shadow-rojo: 0 0 32px rgba(255,51,85,0.2);
      --shadow-amarillo: 0 0 32px rgba(255,204,0,0.2);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Utility ── */
    .hidden { display: none !important; }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .verde { color: var(--verde); }
    .rojo { color: var(--rojo); }
    .amarillo { color: var(--amarillo); }
    .azul { color: var(--azul); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border: none; border-radius: var(--radius-sm);
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease; text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-full { width: 100%; }
    .btn-verde { background: var(--verde); color: #000; }
    .btn-verde:hover { background: #00e87a; box-shadow: var(--shadow-verde); }
    .btn-rojo { background: var(--rojo); color: #fff; }
    .btn-rojo:hover { box-shadow: var(--shadow-rojo); }
    .btn-azul { background: var(--azul); color: #fff; }
    .btn-azul:hover { box-shadow: 0 0 24px rgba(68,136,255,0.35); }
    .btn-amarillo { background: var(--amarillo); color: #000; }
    .btn-danger { background: transparent; border: 1px solid var(--rojo); color: var(--rojo); }
    .btn-danger:hover { background: var(--rojo-dim); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--texto-dim); }
    .btn-ghost:hover { border-color: var(--texto-dim); }
    .btn-icon {
      background: transparent; border: none; cursor: pointer;
      font-size: 1.4rem; padding: 0.5rem; color: var(--texto-dim);
      border-radius: var(--radius-sm); transition: background 0.15s;
    }
    .btn-icon:hover { background: var(--bg-surface); }

    /* ── Form ── */
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
    .form-group label { font-size: 0.85rem; color: var(--texto-dim); font-weight: 500; }
    .inp {
      background: var(--bg-input); border: 1px solid var(--border);
      color: var(--texto); border-radius: var(--radius-sm);
      padding: 0.75rem 1rem; font-size: 1rem; outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }
    .inp:focus { border-color: var(--verde); box-shadow: 0 0 0 3px var(--verde-dim); }
    .toggle-row { flex-direction: row; justify-content: space-between; align-items: center; }
    .toggle-check {
      width: 44px; height: 26px;
      appearance: none; -webkit-appearance: none;
      background: var(--bg-input); border-radius: 13px;
      position: relative; cursor: pointer; transition: background 0.2s;
    }
    .toggle-check:checked { background: var(--verde); }
    .toggle-check::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 50%;
      background: #fff; transition: transform 0.2s;
    }
    .toggle-check:checked::after { transform: translateX(18px); }

    /* ── Card ── */
    .d-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }
    .d-label { font-size: 0.8rem; color: var(--texto-dim); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }

    /* ── Progress bar ── */
    .progress-wrap {
      background: var(--bg-surface);
      border-radius: 100px; height: 10px;
      overflow: hidden; margin: 0.75rem 0;
    }
    .progress-wrap.big { height: 16px; }
    .progress-bar {
      height: 100%; border-radius: 100px;
      background: var(--verde);
      transition: width 0.4s cubic-bezier(.25,.8,.25,1), background 0.3s;
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(2rem);
      padding: 0.75rem 1.5rem; border-radius: 100px;
      font-size: 0.9rem; font-weight: 600; z-index: 9999;
      opacity: 0; transition: all 0.25s ease; white-space: nowrap;
      pointer-events: none; max-width: 90vw;
    }
    .toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast-success { background: var(--verde); color: #000; }
    .toast-error { background: var(--rojo); color: #fff; }
    .toast-warn { background: var(--amarillo); color: #000; }
    .toast-info { background: var(--bg-card); color: var(--texto); border: 1px solid var(--border); }

    /* ── Modal ── */
    #modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 8888; padding: 1.5rem;
      opacity: 0; transition: opacity 0.2s;
    }
    #modal-overlay.modal-show { opacity: 1; }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.75rem;
      width: 100%; max-width: 380px;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.2s;
    }
    #modal-overlay.modal-show .modal-box { transform: none; }
    .modal-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem; }
    .modal-msg { color: var(--texto-dim); margin-bottom: 1.5rem; line-height: 1.5; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }

    /* ── Loading / Error ── */
    .loading-screen, .error-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100dvh; gap: 1rem; color: var(--texto-dim);
    }
    .error-screen span { font-size: 3rem; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--bg-surface);
      border-top-color: var(--verde);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .spinner.rojo { border-top-color: var(--rojo); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HOME ── */
    .home-wrap {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 2rem; gap: 2.5rem;
    }
    .home-logo { text-align: center; }
    .logo-icon { font-size: 4rem; display: block; margin-bottom: 0.5rem; }
    .logo-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; color: var(--texto); }
    .logo-sub { color: var(--texto-dim); font-size: 1rem; margin-top: 0.4rem; }
    .home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%; max-width: 380px; }
    .home-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.75rem 1rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem;
      cursor: pointer; transition: all 0.2s; text-decoration: none;
    }
    .home-card:active { transform: scale(0.97); }
    .home-card.card-verde:hover { border-color: var(--verde); box-shadow: var(--shadow-verde); }
    .home-card.card-azul:hover { border-color: var(--azul); box-shadow: 0 0 24px rgba(68,136,255,0.2); }
    .hc-icon { font-size: 2.5rem; }
    .hc-label { font-size: 0.9rem; font-weight: 600; color: var(--texto-dim); }
    .home-hint { color: var(--texto-dim); font-size: 0.85rem; text-align: center; }

    /* ── CLIENTE ── */
    .cliente-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100dvh;
      padding: 2rem; gap: 1.25rem; text-align: center;
    }
    .cliente-icon { font-size: 4.5rem; animation: popIn 0.4s cubic-bezier(.17,.67,.35,1.3); }
    @keyframes popIn { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .cliente-title { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; }
    .cliente-venue { font-size: 1.1rem; color: var(--texto-dim); }
    .cliente-hint { color: var(--texto-dim); max-width: 280px; line-height: 1.6; }
    .aforo-badge {
      display: flex; align-items: baseline; gap: 0.3rem;
      background: var(--bg-card); border-radius: var(--radius);
      padding: 1rem 1.5rem; border: 1px solid var(--border);
      flex-wrap: wrap; justify-content: center;
    }
    .aforo-badge.verde { border-color: var(--verde); box-shadow: var(--shadow-verde); }
    .aforo-num { font-size: 3rem; font-weight: 800; color: var(--verde); }
    .aforo-sep { font-size: 2rem; color: var(--texto-dim); }
    .aforo-max { font-size: 2rem; font-weight: 600; }
    .aforo-label { width: 100%; text-align: center; font-size: 0.8rem; color: var(--texto-dim); }

    /* ── Incentivo ── */
    .incentivo-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 320px;
    }
    .incentivo-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; }
    .incentivo-desc { color: var(--texto-dim); font-size: 0.95rem; margin-bottom: 1rem; }
    .incentivo-hint { font-size: 0.8rem; color: var(--texto-dim); margin-top: 0.75rem; }
    .sorteo-card { border-color: var(--amarillo); box-shadow: var(--shadow-amarillo); }
    .sorteo-numero {
      font-size: 4rem; font-weight: 900; color: var(--amarillo);
      text-shadow: 0 0 30px rgba(255,204,0,0.5);
      line-height: 1; margin: 0.5rem 0;
    }
    .qr-holder { display: flex; justify-content: center; }
    .qr-holder canvas, .qr-holder img { border-radius: 8px; }

    /* ── Cupón ── */
    .cupon-card {
      background: var(--bg-card); border: 2px solid var(--verde);
      border-radius: var(--radius); padding: 2rem; text-align: center;
      max-width: 320px; width: 100%; box-shadow: var(--shadow-verde);
    }
    .cupon-card.cupon-usado { border-color: var(--texto-dim); box-shadow: none; }
    .cupon-badge {
      display: inline-block; padding: 0.25rem 0.75rem;
      border-radius: 100px; font-size: 0.75rem; font-weight: 700;
      background: var(--verde); color: #000; margin-bottom: 1rem;
    }
    .cupon-usado .cupon-badge { background: var(--texto-dim); color: #000; }
    .cupon-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .cupon-title { font-size: 2rem; font-weight: 800; color: var(--verde); }
    .cupon-usado .cupon-title { color: var(--texto-dim); }
    .cupon-sub { color: var(--texto-dim); margin: 0.5rem 0 1rem; }
    .cupon-code { font-family: monospace; font-size: 0.75rem; color: var(--texto-dim); }

    /* ── PIN ── */
    .pin-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 2rem; gap: 1.5rem;
    }
    .pin-logo { font-size: 3.5rem; }
    .pin-title { font-size: 1.4rem; font-weight: 700; }
    .pin-display {
      font-size: 2.5rem; letter-spacing: 0.5em; font-weight: 300;
      color: var(--verde); background: var(--bg-card);
      padding: 1rem 2rem; border-radius: var(--radius);
      border: 1px solid var(--border); min-width: 220px; text-align: center;
    }
    .pin-error { color: var(--rojo); font-size: 0.85rem; min-height: 1.2em; }
    .numpad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem; width: 100%; max-width: 280px;
    }
    .numpad-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--texto); border-radius: var(--radius-sm);
      font-size: 1.6rem; font-weight: 600;
      padding: 1.1rem; cursor: pointer;
      transition: all 0.12s; -webkit-tap-highlight-color: transparent;
    }
    .numpad-btn:active { background: var(--bg-surface); transform: scale(0.95); }
    .numpad-btn.invisible { opacity: 0; pointer-events: none; }

    /* ── PORTERO OPS ── */
    .portero-screen {
      display: flex; flex-direction: column; align-items: center;
      min-height: 100dvh; padding: 1.25rem; gap: 1rem;
      transition: background 0.3s;
    }
    .portero-header {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 0.5rem 0;
    }
    .portero-venue { font-size: 1.1rem; font-weight: 700; }
    .aforo-display {
      display: flex; align-items: baseline; gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .aforo-current {
      font-size: 5rem; font-weight: 900; line-height: 1;
      color: var(--verde); transition: color 0.3s;
    }
    .aforo-slash { font-size: 2.5rem; color: var(--texto-dim); }
    .aforo-maximo { font-size: 2.5rem; font-weight: 600; }
    .aforo-label-txt { color: var(--texto-dim); font-size: 0.85rem; }
    .pct-label { font-size: 0.85rem; color: var(--texto-dim); text-align: right; }
    .portero-buttons {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.75rem; width: 100%; flex: 1;
      margin-top: 0.5rem;
    }
    .btn-op {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.75rem; border: none; border-radius: var(--radius);
      font-size: 1.2rem; font-weight: 800; cursor: pointer;
      min-height: 160px; transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.05em;
    }
    .btn-op span:first-child { font-size: 2.5rem; }
    .btn-op:active { transform: scale(0.96); }
    .btn-op:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
    .btn-entrada { background: var(--verde-dim); color: var(--verde); border: 2px solid var(--verde); }
    .btn-entrada:hover:not(:disabled) { background: var(--verde); color: #000; box-shadow: var(--shadow-verde); }
    .btn-salida { background: var(--rojo-dim); color: var(--rojo); border: 2px solid var(--rojo); }
    .btn-salida:hover { background: var(--rojo); color: #fff; box-shadow: var(--shadow-rojo); }
    .portero-alert {
      width: 100%; padding: 0.85rem 1rem; border-radius: var(--radius-sm);
      font-weight: 600; font-size: 0.9rem; text-align: center;
    }
    .state-warn .portero-alert { background: var(--amarillo-dim); color: var(--amarillo); border: 1px solid var(--amarillo); }
    .state-full .portero-alert { background: var(--rojo-dim); color: var(--rojo); border: 1px solid var(--rojo); }
    .state-warn .aforo-current { color: var(--amarillo); }
    .state-full .aforo-current { color: var(--rojo); }
    .btn-validar {
      width: 100%; padding: 0.85rem; background: var(--bg-surface);
      border: 1px solid var(--border); color: var(--texto-dim);
      border-radius: var(--radius-sm); font-size: 0.9rem; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-validar:hover { border-color: var(--texto-dim); color: var(--texto); }

    /* ── AUTH ── */
    .auth-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 2rem;
    }
    .auth-logo { font-size: 3.5rem; margin-bottom: 0.5rem; }
    .auth-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 2rem; }
    .auth-form { width: 100%; max-width: 360px; }
    .auth-error { color: var(--rojo); font-size: 0.85rem; min-height: 1.2em; margin-bottom: 0.75rem; }

    /* ── DUEÑO DASHBOARD ── */
    .dueno-screen { display: flex; flex-direction: column; min-height: 100dvh; }
    .dueno-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
      background: var(--bg-card); position: sticky; top: 0; z-index: 10;
    }
    .dueno-logo { font-size: 1.3rem; margin-right: 0.5rem; }
    .dueno-nombre { font-size: 1.1rem; font-weight: 700; }
    .tab-nav {
      display: flex; overflow-x: auto; gap: 0;
      background: var(--bg-card); border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .tab-nav::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 0.85rem 1.1rem; background: none; border: none;
      color: var(--texto-dim); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab-btn.active { color: var(--verde); border-bottom-color: var(--verde); }
    .tab-content { flex: 1; padding: 1.25rem; overflow-y: auto; }

    /* ── Dashboard grid ── */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .dashboard-grid .aforo-main { grid-column: 1 / -1; }
    .big-counter {
      display: flex; align-items: baseline; gap: 0.3rem;
      font-size: 3.5rem; font-weight: 900; line-height: 1; margin-bottom: 0.5rem;
    }
    .big-counter.verde { color: var(--verde); }
    .big-counter.amarillo { color: var(--amarillo); }
    .big-counter.rojo { color: var(--rojo); }
    .big-slash { font-size: 2rem; color: var(--texto-dim); }
    .stat-num { font-size: 2.5rem; font-weight: 800; }

    /* ── Stats ── */
    .stats-section { display: flex; flex-direction: column; gap: 0.75rem; }
    .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.75rem; }
    .chart-canvas {
      width: 100%; height: 180px;
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .stats-pills { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .stat-pill {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 1rem;
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .sp-label { font-size: 0.75rem; color: var(--texto-dim); }
    .sp-val { font-size: 1.4rem; font-weight: 700; color: var(--verde); }

    /* ── Incentivos ── */
    .incentivos-section { display: flex; flex-direction: column; gap: 0.75rem; }
    .toggle-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .toggle-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem; border-radius: var(--radius-sm);
      background: var(--bg-surface); cursor: pointer;
      font-weight: 500; transition: background 0.15s;
    }
    .toggle-item input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: var(--verde);
    }
    .participaciones-list {
      max-height: 200px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .part-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.5rem 0.75rem; background: var(--bg-surface);
      border-radius: var(--radius-sm);
    }
    .part-item.ganador { background: rgba(255,204,0,0.15); border: 1px solid var(--amarillo); }
    .part-num { font-weight: 700; color: var(--azul); }
    .part-token { font-family: monospace; font-size: 0.75rem; color: var(--texto-dim); }
    .ganador-badge {
      padding: 0.5rem 1rem; background: var(--amarillo-dim);
      border: 1px solid var(--amarillo); border-radius: var(--radius-sm);
      font-weight: 700; color: var(--amarillo); margin-bottom: 0.75rem;
    }

    /* ── Config ── */
    .config-section { display: flex; flex-direction: column; gap: 0.75rem; }

    /* ── QR Generator ── */
    .qr-section { display: flex; flex-direction: column; gap: 1.25rem; }
    .qr-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .qr-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
      display: flex; flex-direction: column; align-items: center; gap: 0.75rem; text-align: center;
    }
    .qr-entrada { border-color: var(--verde); }
    .qr-salida { border-color: var(--rojo); }
    .qr-item h3 { font-size: 0.9rem; font-weight: 700; }
    .qr-entrada h3 { color: var(--verde); }
    .qr-salida h3 { color: var(--rojo); }
    .qr-url { font-size: 0.6rem; color: var(--texto-dim); word-break: break-all; }
    .qr-hint { text-align: center; color: var(--texto-dim); font-size: 0.85rem; }

    /* ── Animations / states ── */
    @keyframes pulseWarn {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,204,0,0.3); }
      50% { box-shadow: 0 0 0 12px rgba(255,204,0,0); }
    }
    @keyframes pulseFull {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,51,85,0.4); }
      50% { box-shadow: 0 0 0 16px rgba(255,51,85,0); }
    }
    .state-warn .btn-salida { animation: pulseWarn 2s infinite; }
    .state-full { background: rgba(255,51,85,0.04); }
    .state-full .btn-salida { animation: pulseFull 1.5s infinite; }

    /* ── Responsive ── */
    @media (min-width: 480px) {
      .portero-buttons { max-width: 420px; }
      .tab-content { max-width: 600px; margin: 0 auto; }
    }
  </style>
</head>
